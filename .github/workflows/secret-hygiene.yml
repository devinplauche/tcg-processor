name: Secret Hygiene

on:
  pull_request:

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend test dependencies
        run: python -m pip install -r frontend/mtg-inventory/requirements.txt

      - name: Run non-live secret hygiene tests
        working-directory: frontend/mtg-inventory
        run: python -m pytest test_secret_management.py
